name: Aggregate News

on:
  schedule:
    - cron: '30 5 * * *'   # UTC 05:30 = Moscow 08:30
    - cron: '0 11 * * *'   # UTC 11:00 = Moscow 14:00
    - cron: '0 17 * * *'   # UTC 17:00 = Moscow 20:00
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: aggregate-news
  cancel-in-progress: false

jobs:
  test-pipeline:
    name: Test news pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pipeline
        run: pip install -e '.[dev]'

      - name: Test and lint
        run: |
          pytest -q
          ruff check src tests
          python -m trends.cli build-fixture --root .

  aggregate:
    name: Collect and aggregate news
    needs: test-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pipeline
        run: pip install -e .

      - name: Run pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -m trends.cli run --root .
          python -m trends.cli retention --root .

      - name: Verify pipeline output
        run: |
          for feed in world tech fc-liverpool; do
            file="data/digests/${feed}/current.json"
            if [ ! -f "$file" ]; then
              echo "::error::${file} missing"
              exit 1
            fi
            count=$(python3 -c "import json; print(len(json.load(open('${file}'))['events']))")
            echo "${feed}: ${count} events"
          done

      - name: Persist JSON archive
        id: persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/digests data/runs

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes"
          else
            git commit -m "data: update daily digests"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do not start another push workflow.
      # Dispatch the app workflow explicitly after fresh JSON reaches main.
      - name: Trigger app build
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build_app.yml --ref main
