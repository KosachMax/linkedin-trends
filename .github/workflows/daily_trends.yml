name: Daily Trends

on:
  schedule:
    - cron: '30 5 * * *'   # UTC 05:30 = Moscow 08:30
    - cron: '0 11 * * *'   # UTC 11:00 = Moscow 14:00
    - cron: '0 17 * * *'   # UTC 17:00 = Moscow 20:00
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: daily-trends
  cancel-in-progress: false

jobs:
  test-next-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install next pipeline
        run: pip install -e '.[dev]'

      - name: Test and build fixture digests
        run: |
          pytest -q
          ruff check src tests
          python -m trends.cli build-fixture --root .

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install Astro dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check and build Astro
        working-directory: frontend
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          pnpm run check
          pnpm run build

      - name: Upload Astro preview
        uses: actions/upload-artifact@v7
        with:
          name: astro-preview
          path: frontend/dist

  generate:
    needs: test-next-stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run pipelines
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_MODE: github
        run: python main.py --mode all

      - name: Run next JSON pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -m trends.cli run --root .
          python -m trends.cli retention --root .

      - name: Persist JSON archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/digests data/runs data/currency_history.json
          if git diff --cached --quiet; then
            echo "No JSON archive changes"
          else
            git commit -m "data: update daily digests [skip ci]"
            git push
          fi

      - name: Verify pipeline output
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "--- data/digests ---"
          ls -la data/digests/
          for feed in world tech fc-liverpool; do
            file="data/digests/${feed}/current.json"
            if [ ! -f "$file" ]; then
              echo "::error::${file} missing — new pipeline failed"
              exit 1
            fi
            count=$(python3 -c "import json; d=json.load(open('${file}')); print(len(d['events']))")
            echo "${feed}: ${count} events"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install Astro dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check and build Astro site
        working-directory: frontend
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          BASE_PATH: /linkedin-trends/
          SITE_URL: https://kosachmax.github.io/linkedin-trends
        run: |
          pnpm run check
          pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          publish_branch: gh-pages
