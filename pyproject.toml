[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-trends"
version = "0.2.0"
description = "Config-driven static news digest pipeline"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0",
  "google-genai>=1.0",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "rapidfuzz>=3.9",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
trends = "trends.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

